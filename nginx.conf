# La Marquise — Nginx reverse proxy + static SPA + cache + sécurité

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 20M;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml
        font/woff font/woff2;

    # ── Cache statique par type ──
    map $sent_http_content_type $expires {
        default off;
        ~image/ max;                  # Images : cache max (Vite hashing)
        ~font/ max;                   # Fonts : cache max
        ~application/javascript 1m;   # JS : 1 minute (Vite hashing gère l'invalidation)
        ~text/css 1m;                 # CSS : 1 minute (Vite hashing)
        ~text/html no-cache;          # HTML : jamais caché (SPA)
    }
    expires $expires;

    # ── Sécurité ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── HTTP → HTTPS ──
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl http2;
        server_name lamarquise-douala.cm www.lamarquise-douala.cm;

        # ── SSL Let's Encrypt ──
        ssl_certificate /etc/letsencrypt/live/lamarquise-douala.cm/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lamarquise-douala.cm/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        # ── Frontend React (SPA) ──
        root /usr/share/nginx/html;
        index index.html;

        # ── API → Backend FastAPI (pas de cache) ──
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # ── Docs API ──
        location /docs {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
        }

        # ── Assets Vite (hashés, cache long) ──
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ── Images ──
        location /images/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always; # 30 jours
        }

        # ── Médias ──
        location /medias/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000" always;
        }

        # ── Favicon ──
        location = /favicon.ico {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # ── SPA : tout le reste → index.html ──
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
